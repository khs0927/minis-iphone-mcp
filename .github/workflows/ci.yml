name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # ubuntu-latest moved to Ubuntu 26.04 on 2026-10-19, where actions/python-versions
    # ships no CPython 3.9 build. Pin to 24.04 (last LTS with a 3.9 build) so the
    # declared requires-python ">=3.9" support stays covered.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Test
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax + import check
        run: |
          python -m compileall -q minis_bridge
          python -c "import minis_bridge.server, minis_bridge.cli, minis_bridge.oauth"
      - name: Selftest CLI (in-process)
        run: python -m minis_bridge.cli tools | head -5
