[project]
name = "minis-iphone-mcp"
version = "2.0.0"
description = "Expose an iPhone (iOS native frameworks + the Minis app) to MCP clients - Claude Code, Claude mobile, or anything that speaks MCP."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "ios", "iphone", "claude", "minis", "model-context-protocol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# No runtime dependencies on purpose: the bridge has to run inside the
# Alpine/musl sandbox of a phone, where many wheels do not exist.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
minis-bridge = "minis_bridge.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["minis_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
